<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>ISOM GT factory</title>
<style>
  :root { --bg:#1b1d22; --panel:#262932; --line:#3a3e4a; --txt:#e6e8ee; --mut:#8a8f9c;
          /* barvy stavů MIMO ISOM paletu (magenta/červená/cyan se v OB mapě nevyskytují) */
          --tp:#ff00ff; --fp:#ff2525; --new:#00d8ff; --un:#ff00ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui, sans-serif; }
  #app { max-width:1000px; margin:0 auto; padding:12px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  header .mut { color:var(--mut); }
  button { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; font-size:14px; cursor:pointer; }
  button:hover { border-color:#5b6172; }
  button.primary { background:#34507a; border-color:#4569a8; }
  /* dlaždice + overlay symbolů */
  #stage { display:flex; justify-content:center; }
  #tilewrap { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:6px;
              line-height:0; cursor:crosshair; }
  #tileimg { image-rendering:pixelated; display:block; border-radius:6px; }
  .sym { position:absolute; border-radius:50%; border:3px solid; transform:translate(-50%,-50%);
         cursor:pointer; pointer-events:auto; box-sizing:border-box;
         box-shadow:0 0 0 1.5px #fff, 0 0 4px 2px rgba(0,0,0,.55); }  /* bílé halo + tmavý glow = vidět na čemkoli */
  .sym.unreviewed { border-color:var(--un); }                          /* magenta prázdný = detekce čeká */
  .sym.confirmed  { border-color:var(--tp); background:rgba(255,0,255,.40); }  /* magenta vyplněný = TP */
  .sym.rejected   { border-color:var(--fp); border-style:dashed; opacity:.55; box-shadow:none; }  /* červená čárkovaná = FP */
  .sym.added      { border-color:var(--new); }                         /* cyan = doplněno (FN) */
  .nav { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  .nav .hint { color:var(--mut); font-size:12px; }
  #activebar { margin:6px 0; color:var(--mut); }
  #activebar b { color:var(--txt); }
  /* ISOM paleta */
  #palette { display:flex; flex-wrap:wrap; gap:3px; margin-top:8px;
             max-height:260px; overflow-y:auto; padding:6px; background:var(--panel); border-radius:6px; }
  .sw { position:relative; width:42px; height:42px; border:2px solid transparent; border-radius:5px;
        display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .sw img { width:34px; height:34px; object-fit:contain; }
  .sw.theme { outline:2px solid #ffd00088; }
  .sw.active { border-color:#fff; }
  .sw .code { position:absolute; bottom:-1px; left:1px; font-size:8px; color:#000a; background:#fff8;
              border-radius:2px; padding:0 1px; line-height:1.1; }
  .sw .badge { position:absolute; top:-4px; right:-4px; background:var(--tp); color:#fff; font-size:9px;
               min-width:14px; height:14px; border-radius:7px; text-align:center; line-height:14px; }
  .legend { color:var(--mut); font-size:12px; margin-top:6px; }
  .legend i { font-style:normal; padding:1px 6px; border-radius:8px; border:2px solid; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b id="src">—</b>
    <span class="mut">dlaždice <span id="tilepos"></span> · <span id="tileid"></span></span>
    <span class="mut" id="progress"></span>
    <span style="flex:1"></span>
    <button class="primary" onclick="markReviewed()">dlaždice hotová [H]</button>
  </header>

  <div id="stage"><div id="tilewrap"><img id="tileimg" alt="dlaždice"></div></div>
  <div id="tilestats" style="text-align:center; margin:8px 0; font-weight:600"></div>

  <div class="nav">
    <button onclick="moveTile(-1)">‹ předchozí [←]</button>
    <button onclick="moveTile(1)">další [→] ›</button>
    <button onclick="nextUnreviewed()">další nezkontrolovaná [u]</button>
    <span class="hint">klik na kroužek = TP↔FP · klik do mapy = přidat vybraný symbol · klik na modrý = smazat</span>
  </div>

  <div id="activebar">vybraný symbol k doplnění: <b id="activelabel">— (vyber z palety)</b></div>
  <div class="legend">
    <i style="border-color:var(--un)">detekce (čeká)</i>
    <i style="border-color:var(--tp);background:rgba(255,0,255,.4)">potvrzeno TP</i>
    <i style="border-color:var(--fp);border-style:dashed">zamítnuto FP</i>
    <i style="border-color:var(--new)">doplněno FN</i>
  </div>
  <div id="palette"></div>
</div>

<script>
// ===== stav v prohlížeči =====
let P = null;            // /api/tileset (paleta, seznam dlaždic, gt_counts…)
let T = null;            // detail aktuální dlaždice (symbols)
let idx = 0;             // index dlaždice
let activeCode = null;   // vybraný ISOM kód pro doplňování (FN)
let activeName = '';
const SCALE = 1.4;       // zvětšení dlaždice pro pohodlné klikání (souřadnice přepočítáváme zpět)

async function getJSON(u){ return (await fetch(u)).json(); }
async function postJSON(u,b){ return (await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
                                                    body:JSON.stringify(b)})).json(); }

async function load(){
  P = await getJSON('/api/tileset');
  document.getElementById('src').textContent = `${P.source_map} — téma ${P.theme}`;
  renderPalette();
  // začni na první nezkontrolované dlaždici
  const firstNew = P.tiles.findIndex(t => !t.reviewed);
  idx = firstNew >= 0 ? firstNew : 0;
  await loadTile();
}

// ===== ISOM paleta (= výběr kódu + KOMPAS dashboard) =====
function renderPalette(){
  const pal = document.getElementById('palette');
  const themeSet = new Set(P.theme_codes);
  // jen symboly aktuálního tématu — ostatní ISOM kódy se projedou v jiném tématu (čistá pracovní paleta)
  pal.innerHTML = P.palette.filter(s => themeSet.has(s.code)).map(s => {
    const cat = P.categories[s.category];
    const bg = cat ? cat[1] : '#999';
    const cnt = P.gt_counts[s.code] || 0;
    const cls = 'sw' + (themeSet.has(s.code) ? ' theme' : '') + (s.code===activeCode ? ' active' : '');
    return `<div class="${cls}" style="background:${bg}" title="${s.code} ${s.name}"
                 onclick="selectCode('${s.code}','${s.name.replace(/'/g,"")}')">
              <img src="/api/icon?name=${encodeURIComponent(s.svg)}" alt="${s.code}">
              <span class="code">${s.code}</span>
              ${cnt ? `<span class="badge">${cnt}</span>` : ''}
            </div>`;
  }).join('');
}

function selectCode(code, name){
  activeCode = code; activeName = name;
  document.getElementById('activelabel').textContent = `${code} ${name}`;
  renderPalette();  // překresli zvýraznění aktivního
}

// ===== dlaždice + symboly =====
async function loadTile(){
  const meta = P.tiles[idx];
  T = await getJSON('/api/tile_detail?id=' + encodeURIComponent(meta.id));
  const img = document.getElementById('tileimg');
  img.style.width = (T.w * SCALE) + 'px';
  img.style.height = (T.h * SCALE) + 'px';
  img.src = '/api/tile?id=' + encodeURIComponent(T.id);
  document.getElementById('tilepos').textContent = `${idx+1}/${P.tiles.length}`;
  document.getElementById('tileid').textContent = T.id + (T.reviewed ? ' ✓' : '');
  renderSymbols();
  renderProgress();
}

function renderProgress(){
  document.getElementById('progress').textContent =
    `zkontrolováno ${P.n_reviewed}/${P.tiles.length} dlaždic`;
}

function renderSymbols(){
  const wrap = document.getElementById('tilewrap');
  wrap.querySelectorAll('.sym').forEach(e => e.remove());
  T.symbols.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'sym ' + (s.status || 'unreviewed');
    const r = 13;  // poloměr kroužku v px displeje
    d.style.left = (s.x * SCALE) + 'px';
    d.style.top  = (s.y * SCALE) + 'px';
    d.style.width = d.style.height = (2*r) + 'px';
    d.title = `${s.code} (${s.origin}/${s.status||'unreviewed'})`;
    d.onclick = (e) => { e.stopPropagation(); clickSymbol(i); };
    wrap.appendChild(d);
  });
  renderTileStats();
}

function renderTileStats(){
  // přehled, kolik značek je na dlaždici (a v jakém stavu)
  const c = {unreviewed:0, confirmed:0, rejected:0, added:0};
  T.symbols.forEach(s => { c[s.status || 'unreviewed'] = (c[s.status || 'unreviewed'] || 0) + 1; });
  document.getElementById('tilestats').textContent =
    `značek na dlaždici: ${T.symbols.length}  ·  detekce ${c.unreviewed} · TP ${c.confirmed} · FP ${c.rejected} · doplněno ${c.added}`;
}

function clickSymbol(i){
  const s = T.symbols[i];
  if (s.origin === 'added') {           // doplněný omylem → klik smaže
    T.symbols.splice(i, 1);
  } else {                               // detekce → cyklus potvrdit/zamítnout
    s.status = (s.status === 'confirmed') ? 'rejected' : 'confirmed';
  }
  save();
}

// klik do mapy (mimo kroužek) = doplnit přehlédnutý symbol (FN)
document.getElementById('tilewrap').addEventListener('click', (e) => {
  if (!activeCode){ alert('Vyber nejdřív symbol z palety dole.'); return; }
  const rect = document.getElementById('tileimg').getBoundingClientRect();
  const x = (e.clientX - rect.left) / SCALE;
  const y = (e.clientY - rect.top) / SCALE;
  T.symbols.push({code:activeCode, x:Math.round(x*10)/10, y:Math.round(y*10)/10,
                  origin:'added', status:'added'});
  save();
});

async function save(){
  const res = await postJSON('/api/tile_gt', {id:T.id, symbols:T.symbols, reviewed:T.reviewed});
  if (res.ok){ P.gt_counts = res.gt_counts; P.n_reviewed = res.n_reviewed; }
  renderSymbols();
  renderPalette();      // badge counts se mění
  renderProgress();
}

// ===== navigace =====
function moveTile(d){
  idx = Math.min(P.tiles.length-1, Math.max(0, idx + d));
  loadTile();
}
function nextUnreviewed(){
  for (let k=1; k<=P.tiles.length; k++){
    const j = (idx + k) % P.tiles.length;
    if (!P.tiles[j].reviewed){ idx = j; loadTile(); return; }
  }
}
async function markReviewed(){
  T.reviewed = true;
  P.tiles[idx].reviewed = true;
  await save();
  nextUnreviewed();
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') moveTile(-1);
  else if (e.key === 'ArrowRight') moveTile(1);
  else if (e.key === 'u') nextUnreviewed();
  else if (e.key === 'h' || e.key === 'H') markReviewed();
});

load();
</script>
</body>
</html>
